[package]
name = "llamacpp-gui"
version = "0.3.2"
description = "llama.cpp GUI - Tauri 2 外壳，管理 llama-server router mode"
authors = ["llamacpp-gui"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "llamacpp_gui_lib"
# 只留 rlib：staticlib / cdylib 是给 iOS / Android 用的，桌面 exe 链接 rlib 就够了。
# 留着它们每次构建都会多产出一大坨中间产物（debug 下 .lib 有 780 MB、release 下 209 MB）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
walkdir = "2"

# 联网搜索的 HTTP 走系统 curl.exe，不引 reqwest（理由见 src/search.rs 顶部注释：
# 本机 schannel 不可用 —— cargo 直连 https 会报 SEC_E_NO_CREDENTIALS，
# 而 curl.exe 自带 TLS 后端，实测能正常访问各搜索 API）。

# 只用来清掉系统标题栏左边那个小图标（WM_SETICON + ICON_SMALL，见 lib.rs 的
# strip_caption_chrome）。windows-sys 本来就在依赖树里（tauri / tao 用它），
# 这里只是把已经锁定的版本提成直接依赖，不会多下载东西。
#
# Win32_System_SystemInformation / Win32_System_Threading 是监控采集层
# （src/monitor.rs）要的：GetSystemTimes（在 Threading 模块）算 CPU 占用、
# GlobalMemoryStatusEx（在 SystemInformation 模块）读物理内存。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    # PDH 性能计数器：磁盘吞吐（PhysicalDisk(_Total)）要它
    "Win32_System_Performance",
    # 模型下载页的磁盘预检（src/strata_download.rs）：GetDiskFreeSpaceExW
    "Win32_Storage_FileSystem",
] }

# ---------- 构建体积控制 ----------
# Windows 上默认的完整调试信息（PDB）会把 target/ 顶到 10 GB 量级。
# 只留行号表：断点仍能定位到行，代价是看不到变量值 —— Rust 侧排查主要靠日志，够用。
[profile.dev]
debug = "line-tables-only"

# 依赖不需要调试符号（PDB 的大头都在依赖里）
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
