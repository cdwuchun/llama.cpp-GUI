[package]
name = "llamacpp-gui"
version = "0.1.1"
description = "llama.cpp GUI - Tauri 2 外壳，管理 llama-server router mode"
authors = ["llamacpp-gui"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "llamacpp_gui_lib"
# 只留 rlib：staticlib / cdylib 是给 iOS / Android 用的，桌面 exe 链接 rlib 就够了。
# 留着它们每次构建都会多产出一大坨中间产物（debug 下 .lib 有 780 MB、release 下 209 MB）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
walkdir = "2"

# ---------- 构建体积控制 ----------
# Windows 上默认的完整调试信息（PDB）会把 target/ 顶到 10 GB 量级。
# 只留行号表：断点仍能定位到行，代价是看不到变量值 —— Rust 侧排查主要靠日志，够用。
[profile.dev]
debug = "line-tables-only"

# 依赖不需要调试符号（PDB 的大头都在依赖里）
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
