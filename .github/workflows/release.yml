name: Release

# 打 tag 即发版：`git tag v0.1.0 && git push --tags`。
# 版本号来自 tag，并要求与 src-tauri/tauri.conf.json 的 version 一致 ——
# 那是安装包文件名与 exe 文件版本属性的来源，两者对不上说明 tag 打错了。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # 应用是 Windows 专属（NSIS 安装包、mklink junction、kernel32、WebView2）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 校验 tag 与 tauri.conf.json 的版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $ver) { throw "tag v$tag 与 tauri.conf.json 的 version「$ver」不一致" }
          "版本一致：$ver"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 仓库里的 .cargo/config.toml 把 crates-io 指向本机 127.0.0.1:8787 代理，
      # CI 上没有这个服务，不删就拉不到依赖。
      - name: 移除本机 crates 代理配置
        shell: pwsh
        run: if (Test-Path .cargo/config.toml) { Remove-Item -Force .cargo/config.toml }

      # 发版前先拦一道：坏版本不值得花十分钟打包。
      - name: 前端类型检查
        run: npm run test:web

      - name: 后端单元测试
        run: npm run test:rs

      # tauri build 会自己先跑 beforeBuildCommand（npm run build），不必重复调用。
      - name: 打包
        run: npm run tauri build

      - name: 发版（安装包 + 免安装 exe）
        uses: softprops/action-gh-release@v2
        with:
          # 便携版用户直接拿 exe；需要开始菜单/卸载项的用 NSIS 安装包。
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/llamacpp-gui.exe
          generate_release_notes: true
